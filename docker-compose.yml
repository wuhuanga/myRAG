version: '3.8'

services:
  # FastAPI 后端服务
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lightrag-api
    ports:
      - "8000:8000"
    environment:
      # FastAPI 配置
      - PYTHONUNBUFFERED=1
      
      # Neo4j 连接配置（连接到容器内的neo4j）
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j_default_password}
      
      # LLM 配置
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - LITELLM_URL=${LITELLM_URL:-https://api.deepseek.com}
      - LITELLM_KEY=${LITELLM_KEY}
      
      # Embedding 模型配置
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-/root/workplace/Qwen3-Embedding-0.6B}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      - EMBEDDING_MAX_TOKEN=${EMBEDDING_MAX_TOKEN:-8192}
      
      # 查询配置
      - ENABLE_LLM_CACHE=${ENABLE_LLM_CACHE:-true}
      - TOP_K=${TOP_K:-20}
      - CHUNK_TOP_K=${CHUNK_TOP_K:-10}
      - MAX_ENTITY_TOKENS=${MAX_ENTITY_TOKENS:-5000}
      - MAX_RELATION_TOKENS=${MAX_RELATION_TOKENS:-4000}
      - MAX_TOTAL_TOKENS=${MAX_TOTAL_TOKENS:-16800}
      - SUMMARY_LANGUAGE=${SUMMARY_LANGUAGE:-Chinese}
    
    depends_on:
      neo4j:
        condition: service_healthy
    
    networks:
      - lightrag-network
    
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    volumes:
      - /root/workplace/Qwen3-Embedding-0.6B:/root/workplace/Qwen3-Embedding-0.6B:ro  # ✅ 应该在这里


  # Neo4j 图数据库
  neo4j:
    image: neo4j:5.20.0
    container_name: lightrag-neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-neo4j_default_password}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_memory_heap_initial__size=2G
      - NEO4J_dbms_memory_heap_max__size=4G
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms_security_allow__csv__import__from__file__urls=true
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_logs:/var/lib/neo4j/logs
    networks:
      - lightrag-network
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    restart: unless-stopped

networks:
  lightrag-network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
