[pytest]
# Pytest configuration for myRAG tests

# Minimum version
minversion = 7.0

# Test paths
testpaths = tests

# Add options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers
markers =
    integration: Integration tests that require external services (Nebula, Milvus)
    offline: Offline tests that don't require external services
    slow: Slow tests that take significant time to run
    concurrent: Concurrent and load tests

# Python files and functions
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto
